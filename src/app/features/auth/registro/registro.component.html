<div class="registro-container">
  <div class="registro-card">
    <h1>Crear Cuenta</h1>
    
    <form [formGroup]="registroForm" (ngSubmit)="enviar()">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input 
          id="nombre"
          type="text" 
          formControlName="nombre"
          placeholder="Tu nombre"
          class="form-control"
        >
        <small *ngIf="registroForm.get('nombre')?.hasError('minlength')">
          Mínimo 3 caracteres
        </small>
      </div>

      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input 
          id="apellido"
          type="text" 
          formControlName="apellido"
          placeholder="Tu apellido"
          class="form-control"
        >
        <small *ngIf="registroForm.get('apellido')?.hasError('minlength')">
          Mínimo 3 caracteres
        </small>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input 
          id="email"
          type="email" 
          formControlName="email"
          placeholder="tu@email.com"
          class="form-control"
        >
        <small *ngIf="registroForm.get('email')?.hasError('email')">
          Email inválido
        </small>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono (Opcional)</label>
        <input 
          id="telefono"
          type="tel" 
          formControlName="telefono"
          placeholder="1234567890"
          class="form-control"
        >
        <small *ngIf="registroForm.get('telefono')?.hasError('pattern')">
          Debe tener 10 dígitos
        </small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password"
          type="password" 
          formControlName="password"
          placeholder="••••••••"
          class="form-control"
        >
        <small *ngIf="registroForm.get('password')?.hasError('minlength')">
          Mínimo 6 caracteres
        </small>
      </div>

      <div *ngIf="error" class="alert alert-error">
        {{ error }}
      </div>

      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="cargando"
      >
        {{ cargando ? 'Cargando...' : 'Crear Cuenta' }}
      </button>
    </form>

    <p class="auth-link">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
    </p>
  </div>
</div>
